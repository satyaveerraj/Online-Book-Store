<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Registration Form</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="registration-body">


<div class="registration-container">

    <h1>
        📝 Registration Form
    </h1>

    <p class="registration-subtitle">
        Register for Online Book Store
    </p>

<form onsubmit="registerUser(event)">


    <!-- NAME + EMAIL -->

    <div class="form-row">

        <div class="form-field">

            <label>
                1. Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <div class="form-field">

            <label>
                3. E-mail ID
            </label>

            <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                required
            >

        </div>

    </div>


    <!-- PASSWORD + PHONE -->

    <div class="form-row">

        <div class="form-field">

            <label>
                2. Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >

        </div>


        <div class="form-field">

            <label>
                4. Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="10 digit phone number"
                pattern="[0-9]{10}"
                required
            >

        </div>

    </div>


    <!-- SEX -->

    <div class="form-field">

        <label>
            5. Sex
        </label>

        <div class="radio-group">

            <label>
                <input
                    type="radio"
                    name="sex"
                    value="Male"
                    required
                >
                Male
            </label>

            <label>
                <input
                    type="radio"
                    name="sex"
                    value="Female"
                >
                Female
            </label>

            <label>
                <input
                    type="radio"
                    name="sex"
                    value="Other"
                >
                Other
            </label>

        </div>

    </div>


    <!-- DOB -->

    <div class="form-field">

        <label>
            6. Date of Birth
        </label>

        <div class="dob-group">

            <select id="day" required>

                <option value="">
                    Day
                </option>

                <script>

                    for (
                        let day = 1;
                        day <= 31;
                        day++
                    )
                    {
                        document.write(
                            `<option>${day}</option>`
                        );
                    }

                </script>

            </select>


            <select id="month" required>

                <option value="">
                    Month
                </option>

                <option>January</option>
                <option>February</option>
                <option>March</option>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>

            </select>


            <select id="year" required>

                <option value="">
                    Year
                </option>

                <script>

                    for (
                        let year = 2026;
                        year >= 1960;
                        year--
                    )
                    {
                        document.write(
                            `<option>${year}</option>`
                        );
                    }

                </script>

            </select>

        </div>

    </div>


    <!-- LANGUAGES -->

    <div class="form-field">

        <label>
            7. Languages Known
        </label>

        <div class="checkbox-group">

            <label>
                <input
                    type="checkbox"
                    name="language"
                    value="English"
                >
                English
            </label>

            <label>
                <input
                    type="checkbox"
                    name="language"
                    value="Hindi"
                >
                Hindi
            </label>

            <label>
                <input
                    type="checkbox"
                    name="language"
                    value="Telugu"
                >
                Telugu
            </label>

            <label>
                <input
                    type="checkbox"
                    name="language"
                    value="Tamil"
                >
                Tamil
            </label>

        </div>

    </div>


    <!-- ADDRESS -->

    <div class="form-field">

        <label>
            8. Address
        </label>

        <textarea
            id="address"
            placeholder="Enter your complete address"
            required
        ></textarea>

    </div>


    <!-- BUTTONS -->

    <div class="form-buttons">

        <button
            type="submit"
            class="submit-button"
        >
            Register
        </button>

        <button
            type="reset"
            class="reset-button"
        >
            Reset
        </button>

    </div>


</form>

</div>


<script>

function registerUser(event)
{
    event.preventDefault();

    let languages =
        document.querySelectorAll(
            'input[name="language"]:checked'
        );

    if(languages.length === 0)
    {
        alert(
            "Please select at least one language."
        );

        return;
    }

    let email =
        document.getElementById("email").value;


    localStorage.setItem(
        "registeredEmail",
        email
    );


    alert(
        "Registration Successful! 🎉"
    );


    window.location.href =
        "login.html";
}

</script>


</body>

</html>

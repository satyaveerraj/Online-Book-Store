<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="cart-body">


<div class="catalogue-header">

    <h1>
        🛒 Shopping Cart
    </h1>

    <p>
        Your Selected Books
    </p>

</div>


<div
    class="cart-container"
    id="cartContainer"
>
</div>


<script>

function getCart()
{
    return JSON.parse(
        localStorage.getItem("cart")
    ) || [];
}


function saveCart(cart)
{
    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );
}


function displayCart()
{

    let cart = getCart();

    let container =
        document.getElementById(
            "cartContainer"
        );


    if(cart.length === 0)
    {

        container.innerHTML = `

            <div class="empty-cart">

                <div class="empty-cart-icon">
                    🛒
                </div>

                <h2>
                    Your Cart is Empty
                </h2>

                <p>
                    Add some books from the catalogue.
                </p>

                <a href="catalogue.html">
                    Browse Books
                </a>

            </div>

        `;

        return;
    }


    let total = 0;

    let totalItems = 0;


    let html = `

        <table class="cart-table">

            <thead>

                <tr>

                    <th>S.No.</th>

                    <th>Book Name</th>

                    <th>Author</th>

                    <th>Price</th>

                    <th>Quantity</th>

                    <th>Subtotal</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

    `;


    cart.forEach(
        (book, index) =>
        {

            let subtotal =
                book.price *
                book.quantity;


            total += subtotal;

            totalItems +=
                book.quantity;


            html += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <b>
                            ${book.name}
                        </b>
                    </td>

                    <td>
                        ${book.author}
                    </td>

                    <td>
                        ₹${book.price}
                    </td>

                    <td>

                        <div class="quantity">

                            <button
                                onclick="
                                changeQuantity(
                                    ${index},
                                    -1
                                )"
                            >
                                −
                            </button>

                            <b>
                                ${book.quantity}
                            </b>

                            <button
                                onclick="
                                changeQuantity(
                                    ${index},
                                    1
                                )"
                            >
                                +
                            </button>

                        </div>

                    </td>

                    <td>
                        <b>
                            ₹${subtotal}
                        </b>
                    </td>

                    <td>

                        <button
                            class="remove-button"
                            onclick="
                            removeBook(${index})
                            "
                        >
                            Remove
                        </button>

                    </td>

                </tr>

            `;
        }
    );


    html += `

            </tbody>

        </table>


        <div class="cart-summary">

            <p>
                Total Items:
                <b>${totalItems}</b>
            </p>

            <h2>
                Total Amount:
                <span>
                    ₹${total}
                </span>
            </h2>


            <button
                class="clear-button"
                onclick="clearCart()"
            >
                Clear Cart
            </button>


            <button
                class="checkout-button"
                onclick="placeOrder()"
            >
                Place Order
            </button>

        </div>

    `;


    container.innerHTML = html;
}


function changeQuantity(
    index,
    change
)
{

    let cart = getCart();


    cart[index].quantity +=
        change;


    if(
        cart[index].quantity <= 0
    )
    {
        cart.splice(index, 1);
    }


    saveCart(cart);

    displayCart();
}


function removeBook(index)
{

    let cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    displayCart();
}


function clearCart()
{

    if(
        confirm(
            "Are you sure you want to clear the cart?"
        )
    )
    {

        localStorage.removeItem(
            "cart"
        );

        displayCart();
    }

}


function placeOrder()
{

    let cart = getCart();


    if(cart.length === 0)
    {

        alert(
            "Your cart is empty!"
        );

        return;
    }


    alert(
        "🎉 Order Placed Successfully!\n\n" +
        "Thank you for shopping."
    );


    localStorage.removeItem(
        "cart"
    );


    displayCart();
}


displayCart();

</script>

</body>

</html>

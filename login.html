
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="page-wrap">

        <h2 class="page-title">Login Page</h2>

        <form class="form-card" id="loginForm">

            <p>
                <label for="username">User Name:</label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter your name"
                    required
                    minlength="3"
                >
            </p>

            <p>
                <label for="password">Password:</label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                >
            </p>

            <p class="center">
                <button type="submit">Submit</button>

                <button type="reset">Reset</button>
            </p>

            <p
                id="loginMessage"
                class="message center"
                aria-live="polite"
            ></p>

        </form>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', e => {
            e.preventDefault();

            document.getElementById('loginMessage').textContent =
                'Demo login successful. This lab project does not use a real account server.';
        });

        document.getElementById('loginForm').addEventListener('reset', () => {
            document.getElementById('loginMessage').textContent = '';
        });
    </script>

</body>

</html>
